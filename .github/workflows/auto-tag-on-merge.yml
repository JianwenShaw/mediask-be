name: Auto Tag On Merge

on:
  pull_request:
    types: [closed]
    branches: [master, test]

jobs:
  tag:
    name: Create Environment Tag
    if: >-
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: tag
        run: |
          case "${{ github.event.pull_request.base.ref }}" in
            master) env_name="prod" ;;
            test) env_name="test" ;;
            *)
              echo "Unsupported base branch: ${{ github.event.pull_request.base.ref }}"
              exit 1
              ;;
          esac
          output="$(./scripts/mediask_tag.sh "${env_name}" --push)"
          echo "${output}"
          new_tag="$(echo "${output}" | awk -F': ' '/^Created tag:/ {print $2}' | tail -n 1)"
          if [[ -z "${new_tag}" ]]; then
            echo "::error::Failed to parse created tag from script output."
            exit 1
          fi
          echo "new_tag=${new_tag}" >> "${GITHUB_OUTPUT}"

      - name: Trigger release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release.yml",
              ref: "${{ github.event.pull_request.base.ref }}",
              inputs: {
                tag: "${{ steps.tag.outputs.new_tag }}"
              }
            });
