name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  # 先运行 CI 确保代码质量
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - module: api
            dockerfile: Dockerfile.api
            image_suffix: api
          # 取消注释以启用 worker 镜像构建
          # - module: worker
          #   dockerfile: Dockerfile.worker
          #   image_suffix: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        run: |
          tag_name="${{ inputs.tag }}"
          if [[ -z "${tag_name}" ]]; then
            tag_name="${{ github.ref_name }}"
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}
          tags: |
            # 统一使用解析后的发布标签，兼容 push(tag) 与 workflow_dispatch(tag input)
            type=raw,value=${{ steps.release_tag.outputs.tag_name }}
            # 语义化版本标签：v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}},value=${{ steps.release_tag.outputs.tag_name }},enable=${{ startsWith(steps.release_tag.outputs.tag_name, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release_tag.outputs.tag_name }},enable=${{ startsWith(steps.release_tag.outputs.tag_name, 'v') }}
            type=semver,pattern={{major}},value=${{ steps.release_tag.outputs.tag_name }},enable=${{ startsWith(steps.release_tag.outputs.tag_name, 'v') && !startsWith(steps.release_tag.outputs.tag_name, 'v0.') }}
            # latest 标签（仅正式版本，不含 prerelease）
            type=raw,value=latest,enable=${{ startsWith(steps.release_tag.outputs.tag_name, 'prod-mediask-be-') || (startsWith(steps.release_tag.outputs.tag_name, 'v') && !contains(steps.release_tag.outputs.tag_name, '-')) }}
            # 测试环境滚动标签
            type=raw,value=test-latest,enable=${{ startsWith(steps.release_tag.outputs.tag_name, 'test-mediask-be-') }}

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          platforms: linux/amd64

